[package]
name = "swiftdl-app"
description = "BaaDash桌面下载管理器"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "swiftdl-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }
serde_json = "1.0.154"

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
base64 = "0.23.1"
cbc = { version = "0.1", features = ["alloc"] }
futures-util = "0.3"
librqbit = "9.1.0"
roxmltree = "0.20"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
swiftdl-engine = { path = "../../crates/engine" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tokio = { version = "1.54.1", features = ["time", "sync", "macros"] }
url = "2.5"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

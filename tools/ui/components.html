<!doctype html>
<html lang="zh-CN" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BaaDash UI 组件基准</title>
<style>body{margin:0;padding:40px;background:var(--bg,#101114);color:var(--text,#eee);font:14px/1.6 sans-serif}main{max-width:760px;margin:auto}h1{font-size:24px;margin:0 0 6px}.preview-note{color:var(--muted);margin-bottom:28px}.preview-card{background:var(--panel);padding:24px;border:1px solid var(--border);border-radius:14px;margin:18px 0}.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.preview-tools{display:flex;gap:8px;margin:18px 0}.icon-samples{display:flex;gap:24px;align-items:center}.icon-samples .ic{width:24px;height:24px}@media(max-width:600px){body{padding:20px}.preview-grid{grid-template-columns:1fr}}</style></head>
<body><main><h1>BaaDash UI 组件基准</h1><p class="preview-note">应用的共享样式与实际尺寸；用于后续功能扩展前的视觉核对。</p><div class="preview-tools"><button class="btn" data-theme="light">浅色</button><button class="btn" data-theme="dark">深色</button></div>
<section class="preview-card"><div class="icon-samples"><svg class="ic lucide-icon" data-icon="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 15V3" /> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <path d="m7 10 5 5 5-5" /></svg><svg class="ic lucide-icon" data-icon="palette" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z" /> <circle cx="13.5" cy="6.5" r=".5" fill="currentColor" /> <circle cx="17.5" cy="10.5" r=".5" fill="currentColor" /> <circle cx="6.5" cy="12.5" r=".5" fill="currentColor" /> <circle cx="8.5" cy="7.5" r=".5" fill="currentColor" /></svg><svg class="ic lucide-icon" data-icon="network" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="16" y="16" width="6" height="6" rx="1" /> <rect x="2" y="16" width="6" height="6" rx="1" /> <rect x="9" y="2" width="6" height="6" rx="1" /> <path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /> <path d="M12 12V8" /></svg><svg class="ic lucide-icon" data-icon="clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="10" /> <path d="M12 6v6l4 2" /></svg></div></section>
<section class="preview-card preview-grid"><div class="form-field"><label for="normal">普通输入</label><input class="form-input" id="normal" placeholder="socks5h://127.0.0.1:1080"><p class="field-help">说明独立放在输入框下方。</p></div><div class="form-field"><label for="value">已有内容</label><input class="form-input" id="value" value="127.0.0.1"><p class="field-help">使用语义色，保持可读性。</p></div><div class="form-field"><label for="error">错误状态</label><input class="form-input" id="error" value="不完整的校验值" aria-invalid="true"><p class="field-error" role="alert">请输入完整的 64 位十六进制 SHA-256 校验值。</p></div><div class="form-field"><label for="select">选择控件</label><select class="form-select" id="select"><option>跟随系统</option><option>手动代理</option></select><p class="field-help">控件高度与文本框一致。</p></div></section>
<section class="preview-card"><details class="advanced-panel"><summary><span>高级选项</span><span aria-hidden="true">⌄</span></summary><div class="advanced-body"><label class="advanced-toggle"><input type="checkbox"><span>校验文件<span class="field-help">展开不等于启用，操作必须明确。</span></span></label></div></details><div class="preview-tools"><button class="btn">取消</button><button class="btn primary">保存设置</button></div></section>
</main><script type="module">const dist=new URL('../../app/dist/index.html',location.href);const response=await fetch(dist);const doc=new DOMParser().parseFromString(await response.text(),'text/html');for(const css of doc.querySelectorAll('link[rel=stylesheet]')){const link=document.createElement('link');link.rel='stylesheet';link.href=new URL(css.getAttribute('href'),dist);document.head.append(link)}for(const button of document.querySelectorAll('button[data-theme]'))button.onclick=()=>document.documentElement.dataset.theme=button.dataset.theme;</script></body></html>

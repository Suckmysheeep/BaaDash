name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The interface is TypeScript, built by Vite into app/dist, which the
      # app embeds at compile time.
      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo test --workspace
      - run: cargo build -p swiftdl-app
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfile
          path: Cargo.lock
          retention-days: 3

  # The app has macOS-only code (opening magnet links and .torrent files);
  # make sure it compiles there too.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # The interface is TypeScript, built by Vite into app/dist, which the
      # app embeds at compile time.
      - name: Build the interface
        working-directory: app
        run: npm ci && npm run build
      - run: cargo check -p swiftdl-app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix app
      - run: npm run build --prefix app
      - run: cargo test --workspace
      - run: cargo check -p swiftdl-app

      - name: Build native Windows review binary
        run: cargo build -p swiftdl-app --release --features tauri/custom-protocol
      - name: Prepare native review files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/native-review | Out-Null
          Copy-Item target/release/swiftdl-app.exe target/native-review/
          Copy-Item extension target/native-review/extension -Recurse
          Copy-Item app/src-tauri/gen/extension-firefox target/native-review/extension-firefox -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-review
          path: target/native-review/
          retention-days: 3

  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix tools/brand
      - run: npm run build --prefix tools/brand
      - run: npm run check --prefix tools/brand
      - run: npm ci --prefix app
      - run: npm run build --prefix app
      - run: npm ci --prefix tools/ui
      - run: node tools/site/build.mjs
      - run: npm run test --prefix tools/ui
